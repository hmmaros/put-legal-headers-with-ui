<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="PutLegalHeaders GUI mockup">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131722"/>
      <stop offset="1" stop-color="#0b0e17"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#dcdcdc"/>
    </linearGradient>
  </defs>

  <rect width="960" height="560" fill="url(#desk)"/>

  <!-- main window -->
  <rect x="52" y="96" width="440" height="370" rx="10" fill="#e9e7e4" stroke="#4b5563"/>

  <!-- title bar -->
  <rect x="52" y="96" width="440" height="34" rx="10" fill="url(#titlebar)"/>
  <rect x="52" y="120" width="440" height="10" fill="url(#titlebar)"/>
  <circle cx="76" cy="113" r="5" fill="#38bdf8"/>
  <text x="272" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e5e7eb">PutLegalHeaders</text>

  <!-- form rows -->
  <text x="74" y="172" font-family="sans-serif" font-size="12" fill="#374151">Folder directory</text>
  <rect x="74" y="148" width="260" height="24" fill="#fff" stroke="#9ca3af"/>
  <text x="80" y="164" font-family="sans-serif" font-size="12" fill="#6b7280">C:\work\project</text>
  <rect x="348" y="148" width="70" height="24" rx="3" fill="url(#btn)" stroke="#9ca3af"/>
  <text x="383" y="164" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#111">Browse</text>
  <line x1="74" y1="178" x2="418" y2="178" stroke="#d1cfcc"/>

  <text x="74" y="206" font-family="sans-serif" font-size="12" fill="#374151">Give the text you want to find:</text>
  <rect x="74" y="182" width="334" height="24" fill="#fff" stroke="#9ca3af"/>
  <text x="80" y="198" font-family="sans-serif" font-size="12" fill="#374151">All rights reserved.</text>
  <line x1="74" y1="212" x2="418" y2="212" stroke="#d1cfcc"/>

  <text x="74" y="240" font-family="sans-serif" font-size="12" fill="#374151">Give the suffix-es (separate them with semicolon):</text>
  <rect x="74" y="216" width="334" height="24" fill="#fff" stroke="#9ca3af"/>
  <text x="80" y="232" font-family="sans-serif" font-size="12" fill="#374151">*.ts;*.html</text>
  <line x1="74" y1="246" x2="418" y2="246" stroke="#d1cfcc"/>

  <text x="74" y="278" font-family="sans-serif" font-size="12" fill="#374151">Find the files</text>
  <rect x="164" y="266" width="110" height="22" fill="#fff" stroke="#9ca3af"/>
  <text x="178" y="281" font-family="sans-serif" font-size="12" fill="#111">WITHOUT</text>
  <path d="M 246 270 l 7 6 l -7 6" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="286" y="281" font-family="sans-serif" font-size="12" fill="#374151">the given text</text>

  <rect x="330" y="300" width="108" height="32" rx="4" fill="url(#btn)" stroke="#9ca3af"/>
  <text x="384" y="321" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111">Search</text>

  <text x="470" y="446" text-anchor="end" font-family="sans-serif" font-size="11" fill="#9ca3af">© DC v0.1</text>

  <!-- results window -->
  <rect x="508" y="96" width="400" height="340" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="508" y="96" width="400" height="34" rx="10" fill="url(#titlebar)"/>
  <rect x="508" y="120" width="400" height="10" fill="url(#titlebar)"/>
  <circle cx="532" cy="113" r="5" fill="#38bdf8"/>
  <text x="708" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e5e7eb">Resulting files</text>

  <rect x="526" y="146" width="104" height="26" rx="4" fill="url(#btn)" stroke="#9ca3af"/>
  <text x="578" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">Add Text to Files</text>
  <rect x="638" y="146" width="82" height="26" rx="4" fill="url(#btn)" stroke="#9ca3af"/>
  <text x="679" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">Give Text</text>
  <rect x="728" y="146" width="60" height="26" rx="4" fill="url(#btn)" stroke="#9ca3af"/>
  <text x="758" y="163" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#111">Clear</text>

  <rect x="526" y="184" width="364" height="232" fill="#010409" stroke="#21262d"/>
  <g font-family="monospace" font-size="12">
    <text x="538" y="204" fill="#8b949e">The list of the founded files:</text>
    <text x="538" y="226" fill="#7dd3fc">C:\work\project\src\view\Home.ts</text>
    <text x="538" y="244" fill="#7dd3fc">C:\work\project\src\view\About.ts</text>
    <text x="538" y="262" fill="#7dd3fc">C:\work\project\src\view\index.html</text>
    <text x="538" y="280" fill="#7dd3fc">C:\work\project\src\view\about.html</text>
    <text x="538" y="298" fill="#6b7280">··· 2 more</text>
    <text x="538" y="322" fill="#fde047">6 files founded!!!</text>
    <text x="538" y="348" fill="#4ade80">Adding text process started . . .</text>
    <text x="538" y="366" fill="#8b949e">Done: C:\work\project\src\view\Home.ts</text>
    <text x="538" y="384" fill="#8b949e">Done: C:\work\project\src\view\About.ts</text>
    <text x="538" y="402" fill="#8b949e">Done: ...</text>
  </g>

  <text x="480" y="506" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">↑ main window (left) + results console (right) — mock run; Windows required</text>
</svg>
